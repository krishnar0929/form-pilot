<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FormPilot</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <header class="top">
    <img src="icons/icon32.png" alt="" width="22" height="22" />
    <h1>FormPilot</h1>
    <span class="tag">beta</span>
  </header>

  <details id="settings" class="panel">
    <summary>Settings</summary>
    <label>Anthropic API key
      <input id="apiKey" type="password" placeholder="sk-ant-..." autocomplete="off" />
    </label>
    <label>Model
      <select id="model">
        <option value="claude-sonnet-5-5">Claude Sonnet 5.5 (balanced)</option>
        <option value="claude-opus-5-5">Claude Opus 5.5 (best judgment)</option>
        <option value="claude-haiku-5-5">Claude Haiku 5.5 (fastest)</option>
      </select>
    </label>
    <label>About me (used for Fill mode)
      <textarea id="profile" rows="4" placeholder="Name, email, phone, address, job title, company… anything you want forms filled with."></textarea>
    </label>
    <label class="row"><input id="screenshot" type="checkbox" checked /> Send a screenshot of the visible page (helps with images/posters)</label>
    <p class="fine">Your key and profile stay in Chrome storage on this device and are only sent to api.anthropic.com.</p>
    <button id="debugBtn" class="secondary" style="width:100%;margin-top:6px">Copy debug info (for troubleshooting)</button>
  </details>

  <section class="panel">
    <div class="seg" role="tablist">
      <button data-mode="fill" role="tab">Fill</button>
      <button data-mode="judge" role="tab">Judge</button>
      <button data-mode="check" role="tab">Check</button>
    </div>
    <p id="modeHint" class="fine"></p>
    <textarea id="instructions" rows="3" placeholder="Optional guidance, e.g. “Be strict; data sources look thin” or “Use my work email”."></textarea>
    <label class="attach">
      <input id="files" type="file" multiple accept=".pdf,.txt,.md,.csv,image/*" />
      <span>+ Attach files (PDF, image, text)</span>
    </label>
    <div id="chips" class="chips"></div>
    <label class="row toggle"><input id="autofill" type="checkbox" /> Auto-fill the page as soon as Claude answers (never submits)</label>
    <div class="actions">
      <button id="scanBtn" class="secondary">Scan page</button>
      <button id="runBtn" class="primary">Run</button>
    </div>
    <div id="status" class="status" aria-live="polite"></div>
  </section>

  <section id="summaryBox" class="panel hidden">
    <h2>Summary</h2>
    <p id="summary"></p>
  </section>

  <section id="fields"></section>

  <footer id="footer" class="footer hidden">
    <button id="copyBtn" class="secondary">Copy as text</button>
    <button id="fillBtn" class="primary">Fill selected</button>
  </footer>

  <!-- Optional, git-ignored. Copy config.example.js to config.local.js and add your key. -->
  <script src="config.local.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
